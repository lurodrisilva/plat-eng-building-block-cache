# nameOverride is an optional override for the chart name used in resource naming.
nameOverride: ""
# fullnameOverride is an optional override for the fully qualified resource name.
fullnameOverride: ""

# commonLabels is a map of additional labels to apply to all resources.
commonLabels: {}
# commonAnnotations is a map of additional annotations for resources.
commonAnnotations: {}

# team is the team identifier for resource ownership tracking.
team: ""
# environment is the deployment environment name (e.g., dev, staging, production).
environment: ""

serviceAccount:
  # create specifies whether a service account should be created.
  create: true
  # automount specifies whether to automatically mount a ServiceAccount's API credentials.
  automount: true
  # annotations is a map of annotations to add to the service account.
  annotations: {}
  # name is the name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# resources is the resource limits and requests for the pod.
resources: {}

# nodeSelector is a map of node selector labels for pod scheduling.
nodeSelector: {}

# tolerations is a list of tolerations for pod scheduling.
tolerations: []

# affinity is the affinity configuration for pod scheduling.
affinity: {}

# providerConfigRef is the reference to the Crossplane ProviderConfig to use.
providerConfigRef:
  name: default

# writeConnectionSecretToRef configures where Crossplane writes connection secrets.
writeConnectionSecretToRef:
  namespace: default

# caches.redis is DISABLED — this building block renders nothing.
#
# It emits a RedisCache (Microsoft.Cache/redis), and Azure Cache for Redis is RETIRED. Azure
# does not degrade it or warn; it rejects every new instance outright:
#
#   400 BadRequest: Azure Cache for Redis is retiring, create Azure Managed Redis instance
#   instead. https://aka.ms/AzureCacheForRedisRetirement
#
# So every entry this list could hold is guaranteed to fail. An empty default is not a
# preference — it is the only value that cannot produce a broken resource. Populating it is
# fail-closed in templates/redis-cache.yaml rather than silently emitting a doomed MR.
#
# The successor is Azure Managed Redis, and the platform's path to it is the control plane's
# RedisInstance XR (ADR-0013 + ADR-0019), NOT a bare MR templated here — this chart was already
# slated to re-point at that XR in Phase C. That work is blocked upstream: Azure will not
# currently create a Managed Redis instance in this subscription at all (7 attempts, 3 regions,
# 3 SKUs, all `OperationFailed: The operation failed.`), so plat-eng-control-plane ships
# RedisInstance disabled too.
#
# To re-enable: do NOT repopulate this list. Re-point the template at RedisInstance per Phase C,
# once ADR-0019's Azure-side blocker is resolved.
caches:
  redis: []
