# This suite used to assert the shape of a rendered RedisCache — name, capacity, family, SKU,
# and so on. Every one of those assertions passed while the resource itself was impossible to
# create: Azure Cache for Redis is retired, and Azure rejects each new instance with
#
#   400 BadRequest: Azure Cache for Redis is retiring, create Azure Managed Redis instance
#   instead.
#
# A green suite over a doomed resource is worse than no suite, so the contract under test has
# changed. The block is disabled: it must render nothing by default, and must refuse loudly —
# not silently emit a broken MR — if someone populates it. See ADR-0013 + ADR-0019.
suite: RedisCache Template Tests
templates:
  - "charts/plat-eng-cache-package/templates/redis-cache.yaml"
tests:
  - it: "renders nothing by default — the building block is disabled"
    asserts:
      - hasDocuments:
          count: 0

  - it: "fails closed when caches.redis is populated, rather than emitting a retired RedisCache"
    set:
      plat-eng-cache-package:
        caches:
          redis:
            - name: test-redis
              capacity: 1
              family: "C"
              location: "eastus"
              redisVersion: "6"
              skuName: "Standard"
              resourceGroupName: "test-rg"
              minimumTlsVersion: "1.2"
    asserts:
      - failedTemplate:
          errorPattern: "Azure Cache for Redis is retiring"

  - it: "names Azure Managed Redis as the successor so the reader is not left guessing"
    set:
      plat-eng-cache-package:
        caches:
          redis:
            - name: test-redis
              capacity: 1
              family: "C"
              location: "eastus"
              redisVersion: "6"
              skuName: "Standard"
              resourceGroupName: "test-rg"
              minimumTlsVersion: "1.2"
    asserts:
      - failedTemplate:
          errorPattern: "Azure Managed Redis"
